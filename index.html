<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under World</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #9fe870;
        font: 13px/1.5 monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        pointer-events: none;
        transition: transform 80ms ease-out, background 80ms linear;
      }
      /* 조준(LT) — 점 주위로 십자선이 벌어진다. 조준을 풀면 사라진다 */
      #crosshair .chl {
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        opacity: 0;
        transition: opacity 90ms linear;
        border-radius: 1px;
      }
      #crosshair .chl.t { left: 1px; top: -11px; width: 2px; height: 7px; }
      #crosshair .chl.b { left: 1px; top: 8px; width: 2px; height: 7px; }
      #crosshair .chl.l { left: -11px; top: 1px; width: 7px; height: 2px; }
      #crosshair .chl.r { left: 8px; top: 1px; width: 7px; height: 2px; }
      #crosshair.aim .chl {
        opacity: 1;
      }
      /* 패드 에임 어시스트가 표적을 물었다 — 커지고 붉어진다 (걸리는 게 눈에 보인다) */
      #crosshair.lock {
        background: rgba(255, 122, 106, 0.95);
        transform: scale(2);
        box-shadow: 0 0 6px rgba(255, 110, 90, 0.8);
      }
      #death {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: rgba(60, 0, 0, 0.55);
        color: #ffd9d9;
        font: 20px/1.6 monospace;
        user-select: none;
      }
      #death.visible {
        display: flex;
      }
      #pause {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #d8e0ea;
        font: 22px/1.7 monospace;
        user-select: none;
        letter-spacing: 2px;
      }
      #pause.visible {
        display: flex;
      }
      /* 클릭을 삼키면 포인터 락을 다시 걸 수 없어 재개가 막힌다 —
         메뉴 패널만 예외로 클릭을 받는다 (Input 이 #pause 안 클릭은 락에서 제외) */
      #pause,
      #death {
        pointer-events: none;
      }
      #pause .menu {
        pointer-events: auto;
      }
      #altar-prompt {
        position: fixed;
        /* 하단 상태 블록(바+랜턴+골드+무기 슬롯 ≒ 110px) 위로 올린다 —
           12% 로 두면 창이 낮을 때 HP 바와 겹친다 */
        bottom: 132px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(20, 18, 10, 0.82);
        border: 1px solid #6a5f3a;
        color: #e8c76a;
        font: 14px/1.7 monospace;
        padding: 10px 18px;
        white-space: pre;
        text-align: center;
        pointer-events: none;
      }
      #altar-prompt.visible {
        display: block;
      }
      /* 중앙 상호작용 키캡 — 문처럼 단순한 대상은 긴 문장 대신 조준점 아래 키 하나만.
         (복잡한 안내 — 제단·계단·잠금 게이지 — 는 여전히 하단 altar-prompt) */
      #interact-key {
        position: fixed;
        left: 50%;
        top: calc(50% + 34px);
        transform: translateX(-50%);
        display: none;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(216, 224, 234, 0.65);
        border-bottom-width: 3px;
        border-radius: 6px;
        color: #e8edf2;
        font: bold 15px/1 monospace;
        padding: 6px 12px;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      #interact-key.visible {
        display: block;
      }
      /* 각인 획득 — 화면 가운데 위쪽에 잠깐 뜬다. 각인 색을 그대로 입혀
         "바닥에서 본 그 색"과 이어지게 한다 */
      #sigil-toast {
        position: fixed;
        top: 26%;
        left: 50%;
        transform: translate(-50%, -8px);
        display: none;
        text-align: center;
        font: 15px/1.6 monospace;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 180ms linear, transform 180ms ease-out;
      }
      #sigil-toast.visible {
        display: block;
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #sigil-toast .name {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      #sigil-toast .sub {
        color: #cfd6df;
        margin-top: 2px;
      }
      /* 하단 중앙 상태 표시 — HP + 무기 슬롯 */
      #status {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 340px;
        pointer-events: none;
        user-select: none;
        font: 13px/1.5 monospace;
        text-align: center;
      }
      /* 중앙 기준 좌=HP 우=마나. 각 막대는 중앙에서 바깥으로 자란다 */
      #status-bars {
        display: flex;
        gap: 4px;
        margin-bottom: 3px;
      }
      #status-hp,
      #status-mana {
        flex: 1;
        height: 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        display: flex;
      }
      #status-hp {
        justify-content: flex-end; /* 중앙 쪽에 붙어 왼쪽으로 줄어든다 */
      }
      /* 저체력 — 심장박동 진동과 같은 리듬. 상시 붉은 발광 + 박동마다 두근-두근 */
      #status-hp {
        transition: box-shadow 0.35s ease, border-color 0.35s ease;
      }
      #status-hp.low {
        border-color: #d04040;
        box-shadow: 0 0 16px rgba(230, 50, 50, 0.8), 0 0 4px rgba(255, 90, 90, 0.95);
      }
      @keyframes hp-heartbeat {
        0% { filter: brightness(2.3); }
        16% { filter: brightness(1); }
        30% { filter: brightness(1.9); }
        62% { filter: brightness(1); }
        100% { filter: brightness(1); }
      }
      #status-hp-fill.beat {
        animation: hp-heartbeat 0.6s ease-out;
      }
      #status-hp-fill,
      #status-mana-fill {
        height: 100%;
        width: 100%;
        background: #c22e2e; /* 체력은 붉은색 — 프레임마다 main 이 단계색을 덮는다 */
        transition: width 120ms linear;
      }
      #status-mana-fill {
        background: #4a9eff;
      }
      /* 무적(테스트 키 G) — HP·마나 바가 함께 깜빡인다. 켜 둔 채로 잊고
         플레이하는 사고를 막으려면 화면에서 계속 티가 나야 한다 */
      @keyframes god-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
      #status-hp.god,
      #status-mana.god {
        animation: god-blink 0.62s ease-in-out infinite;
        border-color: #e8d24a;
      }
      /* 스킬 테스트(U) — 마나 무한. 켜 둔 채 잊지 않게 마나 바 틀이 하늘색으로 깜빡인다 */
      #status-mana.skilltest {
        animation: god-blink 0.9s ease-in-out infinite;
        border-color: #4fc3ff;
      }
      /* 지속 회복 맥동 — 음식 효과로 실제로 차오르는 동안 채워진 부분이 은은하게
         숨쉰다 (가득 차거나 효과가 끝나면 멈춘다). 일회성 회복 깜빡임(restore-blink)
         과 겹치면 뒤에 선언된 쪽이 이기므로 이 블록이 먼저 온다 */
      @keyframes regen-pulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.5);
        }
      }
      #status-hp-fill.regen,
      #status-stamina-fill.regen {
        animation: regen-pulse 1.1s ease-in-out infinite;
      }
      /* 스태미너 가속(음식) — 4px 띠에서 미묘한 색조 변화는 안 보인다 (실측).
         띠는 환한 금색으로, 틀 테두리까지 함께 빛나야 비로소 눈에 걸린다 */
      #status-stamina.boosted {
        border-color: #e0c352;
        box-shadow: 0 0 7px rgba(235, 205, 80, 0.55);
      }
      #status-stamina.boosted #status-stamina-fill {
        background: #ffdf56;
        box-shadow: 0 0 8px rgba(255, 220, 90, 0.95);
      }
      /* 회복 깜빡임 — 물약·입자 등으로 게이지가 찰 때 채워진 부분이 깜빡인다.
         이미 가득이면 끝부분만 깜빡여 "찼는데 또 먹었다"를 알린다.
         주기·횟수·끝 폭은 main 이 balance.hud.restoreFlash 로 CSS 변수에 주입한다 */
      @keyframes restore-blink {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(2.6);
        }
      }
      @keyframes restore-tip-blink {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 0.95;
        }
      }
      #status-hp-fill,
      #status-mana-fill,
      #status-stamina-fill {
        position: relative;
      }
      #status-hp-fill.restore-blink,
      #status-mana-fill.restore-blink,
      #status-stamina-fill.restore-blink {
        animation: restore-blink var(--restore-cycle, 0.22s) linear var(--restore-blinks, 4);
      }
      #status-hp-fill.restore-tip::after,
      #status-mana-fill.restore-tip::after,
      #status-stamina-fill.restore-tip::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: var(--restore-tip-w, 2px);
        background: #fff;
        opacity: 0;
        animation: restore-tip-blink var(--restore-cycle, 0.22s) linear var(--restore-blinks, 4);
      }
      /* 끝부분 = 자라는 쪽 — HP 는 오른쪽 고정이라 왼쪽으로 자라고, 마나·스태미너는 반대 */
      #status-hp-fill.restore-tip::after {
        left: 0;
      }
      #status-mana-fill.restore-tip::after,
      #status-stamina-fill.restore-tip::after {
        right: 0;
      }
      /* 거미줄에 걸림 — 화면 가장자리에 끈끈한 흰 막. 끊을수록 옅어진다 */
      #web-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms linear;
        background:
          radial-gradient(ellipse at center, rgba(255, 255, 255, 0) 38%, rgba(226, 232, 220, 0.5) 100%),
          repeating-conic-gradient(
            from 0deg at 50% 50%,
            rgba(230, 233, 224, 0.16) 0deg 2deg,
            rgba(0, 0, 0, 0) 2deg 22deg
          );
      }
      /* 버프 아이콘 줄 — 상태 바 위. 남은 시간은 시계 방향으로 줄어드는 밝은 부채꼴
         (buff-cd 의 conic-gradient 각도를 main 이 매 프레임 갱신) + 남은 초 숫자 */
      #buffs {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      #buff-food {
        position: relative;
        width: 30px;
        height: 30px;
        padding: 3px;
        box-sizing: border-box;
        border: 1px solid #6a5a3a;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        display: none;
      }
      #buff-food.on {
        display: block;
      }
      #buff-food .buff-cd {
        position: absolute;
        inset: 0;
        border-radius: 5px;
        pointer-events: none;
      }
      #buff-food .buff-sec {
        position: absolute;
        right: 1px;
        bottom: -1px;
        font: bold 10px/1 monospace;
        color: #ffe2b0;
        text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      }
      /* 스태미너 — HP·마나 바 바로 아래, 같은 너비의 얇은 띠 */
      #status-stamina {
        height: 4px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        border-top: none;
        margin-bottom: 4px;
      }
      #status-stamina-fill {
        height: 100%;
        width: 100%;
        background: #c9d17a;
        transition: width 90ms linear;
      }
      /* 탈진 — 회복선까지 찰 때까지 질주 불가.
         채움이 0이라 막대가 안 보이므로 틀 자체를 붉게 물들인다 */
      #status-stamina.spent {
        border-color: #7a3a3a;
        background: rgba(96, 34, 34, 0.55);
      }
      #status-stamina.spent #status-stamina-fill {
        background: #a05050;
      }
      /* 랜턴 — 아주 얇은 실선 게이지 + 오른쪽에 % / 예비 개수 */
      #status-lantern {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 5px;
      }
      #status-lantern-track {
        flex: 1;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
      }
      #status-lantern-fill {
        height: 100%;
        width: 100%;
        background: #e0a33a;
        transition: width 120ms linear;
      }
      #status-lantern-text {
        font: 11px/1 monospace;
        color: #8a8f9a;
        letter-spacing: 1px;
        min-width: 92px; /* 자릿수가 바뀌어도 게이지 길이가 흔들리지 않게 */
        text-align: right;
        white-space: nowrap;
      }
      #status-lantern.low #status-lantern-fill {
        background: #e05a3a;
      }
      #status-lantern.low #status-lantern-text {
        color: #e0a33a;
      }
      #status-lantern.off #status-lantern-fill {
        background: #4a4a52;
      }
      #status-gold {
        color: #ffcc3a;
        margin-bottom: 4px;
        text-shadow: 0 0 6px rgba(255, 204, 58, 0.5);
      }
      /* 획득 팝 — 골드·XP 를 먹는 순간 숫자가 잠깐 커졌다 제자리로.
         배율·시간은 main 이 balance.hud.statPop 을 CSS 변수로 주입한다 */
      #status-gold-amt,
      #status-xp-amt {
        display: inline-block;
      }
      #status-xp-amt {
        color: #cfd8c9;
        text-shadow: none;
      }
      @keyframes stat-pop {
        0% {
          transform: scale(var(--stat-pop-scale, 1.6));
        }
        100% {
          transform: scale(1);
        }
      }
      #status-gold-amt.pop,
      #status-xp-amt.pop {
        animation: stat-pop var(--stat-pop-ms, 0.35s) cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      /* 중앙 획득 표시 — 조준선 바로 아래, 먹은 골드·XP 가 잠깐 떠오른다.
         연달아 먹으면 사라지기 전까지 같은 표시에 누적된다 */
      /* 주의: transform 이 있는 조상(#status 등) 안에 두면 fixed 기준이 그 조상이 된다
         — 반드시 body 직속. 조준점 바로 위에 떠서, 머물다 위로 흘러가며 사라진다 */
      #gain-center {
        position: fixed;
        left: 50%;
        top: calc(50% - 22px);
        transform: translate(-50%, -100%);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        font: bold var(--gain-font, 21px) / 1.4 monospace;
        letter-spacing: 0.5px;
        /* 4방향 검정 테두리 — 밝은 벽 앞에서도 읽힌다 */
        text-shadow:
          1px 1px 0 #000,
          -1px 1px 0 #000,
          1px -1px 0 #000,
          -1px -1px 0 #000,
          0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #gain-center-gold {
        filter: drop-shadow(0 0 6px rgba(255, 204, 58, 0.55));
      }
      /* 등장 팝 후 머무는 동안 살짝만 떠오른다 — 사라짐은 main 의 HUD 흡수 비행이
         맡는다 (지갑 표기로 날아가 도착 순간 HUD 숫자가 팝). 시간·폭은 CSS 변수 주입 */
      @keyframes gain-float {
        0% {
          opacity: 1;
          transform: translate(-50%, -100%) scale(1.3);
        }
        12% {
          opacity: 1;
          transform: translate(-50%, -100%) scale(1);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, calc(-100% - var(--gain-rise, 10px)));
        }
      }
      #gain-center.show {
        animation: gain-float var(--gain-hold-ms, 0.9s) ease-out forwards;
      }
      /* 아이콘 바운스 — 먹을 때마다 통통 */
      #gain-center .gc-icon {
        display: inline-block;
        margin-right: 7px;
      }
      @keyframes gc-bounce {
        0% {
          transform: translateY(0) scale(1);
        }
        40% {
          transform: translateY(-7px) scale(1.3);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }
      #gain-center .gc-icon.bounce {
        animation: gc-bounce 0.25s ease-out;
      }
      /* 대량 획득 — 더 크고 밝게 (임계값은 balance.hud.centerGain.bigGold/bigXp) */
      #gain-center .big {
        font-size: calc(var(--gain-font, 21px) * var(--gain-big-mul, 1.35));
      }
      #gain-center-gold.big {
        color: #ffe27a;
        filter: drop-shadow(0 0 9px rgba(255, 214, 80, 0.8));
      }
      #gain-center-xp.big {
        color: #f2f7ee;
      }
      #gain-center-gold {
        color: #ffcc3a;
      }
      #gain-center-xp {
        color: #cfd8c9;
      }
      #status-weapons {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      /* 퀵슬롯 바 — 무기 슬롯 위. 등록만 되고 개수가 0이면 흐리게 남겨 둔다
         (자리가 사라지면 "몇 번이 물약이었지"를 매번 다시 외워야 한다) */
      /* 다이아 퀵슬롯 — 마름모 넷을 사선 십자로 놓는다. 왼쪽=소모품, 오른쪽=스킬.
         화면 아래 양 끝이라 조준선에서 눈을 떼지 않아도 가장자리 시야에 걸린다 */
      .dpad {
        position: fixed;
        bottom: 22px;
        width: 160px;
        height: 160px;
        pointer-events: none;
        user-select: none;
        font: 10px/1 monospace;
      }
      /* 화면 끝이 아니라 가운데 상태창(340px) 바로 옆에 붙인다 — 소모품·체력마나·스킬이
         한 줄로 이어져 눈이 한 번에 훑는다. 해상도가 바뀌어도 간격이 유지되게 중앙 기준 */
      #quick-diamond {
        right: 50%;
        margin-right: 186px;
      }
      #skill-diamond {
        left: 50%;
        margin-left: 186px;
      }
      /* 패드 레이어 홀드(RB=스킬·LB=아이템) — 고르는 중인 뭉치가 살짝 커지고 밝아진다 */
      #quick-diamond,
      #skill-diamond {
        transition: transform 0.12s ease-out, filter 0.12s ease-out;
      }
      #quick-diamond.layer-hold,
      #skill-diamond.layer-hold {
        transform: scale(1.13);
        filter: brightness(1.3);
      }
      .dslot {
        position: absolute;
        width: 58px;
        height: 58px;
        margin: -29px 0 0 -29px;
      }
      /* 자리 — 위 · 오른쪽 · 아래 · 왼쪽 (시계 방향으로 1·2·3·4번 칸) */
      .dslot.p0 { top: 37px; left: 80px; }
      .dslot.p1 { top: 80px; left: 123px; }
      .dslot.p2 { top: 123px; left: 80px; }
      .dslot.p3 { top: 80px; left: 37px; }
      /* 테두리만 돌린다 — 안의 글자·아이콘은 세워 둔 채로 마름모가 된다 */
      .dslot .frame {
        position: absolute;
        inset: 0;
        transform: rotate(45deg);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #3a3a44;
        overflow: hidden;
      }
      /* 차오름 — 스킬은 쿨다운, 소모품은 마시는 중. 마름모라 비스듬히 찬다 */
      .dslot .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--fill, 0%);
        background: rgba(232, 199, 106, 0.28);
      }
      .dslot .key {
        position: absolute;
        top: 9px;
        left: 0;
        right: 0;
        text-align: center;
        color: #8a8f9a;
      }
      .dslot .body {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        line-height: 0;
      }
      .dslot .num {
        position: absolute;
        bottom: 8px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #cfd2da;
      }
      /* 스킬 색 원반 — 24종이 전부 다른 색이라 이것만으로 구분된다 */
      .dslot .mark {
        display: inline-block;
        width: 15px;
        height: 15px;
        border-radius: 50%;
      }
      .dslot.empty .frame {
        opacity: 0.3;
      }
      .dslot.empty .key {
        opacity: 0.4;
      }
      .dslot.ready .frame {
        border-color: #4a6a8a;
      }
      /* 다 썼거나 지금 써도 소용없는 칸 — 눈에 덜 걸리게 */
      .dslot.spent {
        opacity: 0.4;
      }
      .dslot.spent .frame {
        border-color: #3a3a44;
      }
      .dslot.item.ready .frame {
        border-color: #6a5f3a;
      }
      .dslot.cool .mark,
      .dslot.nomana .mark {
        filter: grayscale(0.8) brightness(0.55);
      }
      /* 선택된 칸 — 가운데 클릭(패드 Y)이 쓰는 칸. 금빛 테두리 */
      .dslot.selected .frame {
        border-color: #e8c76a;
        box-shadow: 0 0 7px rgba(232, 199, 106, 0.45);
      }
      .dslot.selected .key {
        color: #e8c76a;
      }
      .dslot.drinking .frame {
        border-color: #e8c76a;
      }
      /* 고른 스킬 이름 — 마름모 안에는 안 들어가므로 뭉치 위에 한 줄로 */
      .dpad .label {
        position: absolute;
        bottom: 100%;
        left: -20px;
        right: -20px;
        text-align: center;
        font-size: 11px;
        color: #cfd2da;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .weapon-slot {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #3a3a44;
        color: #8a8f9a;
        padding: 3px 10px;
        white-space: pre;
      }
      .weapon-slot.charged {
        border-color: #ffb347;
        color: #ffd9a0;
        background: rgba(70, 40, 10, 0.7);
      }
      .weapon-slot.active {
        border-color: #9fe870;
        color: #cfe8b0;
        background: rgba(30, 45, 20, 0.65);
      }
      /* 피격 — 붉은 비네트 */
      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 0, 0, 0) 52%,
          rgba(190, 10, 10, 0.65) 100%
        );
      }
      /* 월드 고정 피격 마커 — 얇은 쐐기가 가해자의 실제 방위를 가리킨다. 회전은 매 프레임
         main 이 현재 시선 기준으로 다시 계산하므로, 몸을 돌리면 마커가 미끄러지며 따라오고
         위 정중앙에 오면 그 적을 정면으로 보고 있다는 뜻이다. 쐐기 크기는 거리(가까울수록 큼) */
      #hitmarks .mark {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 38vmin;
        height: 38vmin;
        margin: -19vmin 0 0 -19vmin;
        opacity: 0;
        pointer-events: none;
        will-change: transform, opacity;
      }
      #hitmarks .mark::before {
        content: '';
        position: absolute;
        left: 50%;
        top: -1vmin;
        width: 3.2vmin;
        height: 4.4vmin;
        margin-left: -1.6vmin;
        background: linear-gradient(to bottom, rgba(255, 46, 46, 0.95), rgba(255, 46, 46, 0.12));
        clip-path: polygon(50% 0, 92% 100%, 50% 74%, 8% 100%);
        transform: scale(var(--s, 1));
        transform-origin: 50% 100%;
      }
      /* 구울 몸부림 게이지 — 물린 동안 조준점 아래. 연타가 원형 링을 시계 방향으로 채운다 */
      #grapple {
        position: fixed;
        left: 50%;
        top: 54%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        pointer-events: none;
      }
      #grapple.visible {
        opacity: 1;
      }
      #grapple-ring {
        width: 94px;
        height: 94px;
        border-radius: 50%;
        background: conic-gradient(#ff5a4a calc(var(--frac, 0) * 1turn), rgba(70, 12, 12, 0.55) 0turn);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(160, 0, 0, 0.75);
      }
      #grapple-inner {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(12, 8, 8, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 20px monospace;
        color: #ff6a5a;
        text-shadow: 0 0 6px rgba(120, 0, 0, 0.9);
      }
      #grapple-label {
        font: bold 20px monospace;
        color: #ff5a4a;
        text-shadow: 0 0 8px rgba(120, 0, 0, 0.9), 0 2px 2px #000;
        letter-spacing: 2px;
      }
      /* 거머리 얼굴 가림 — 흡혈당하는 동안 자줏빛 살덩이가 화면 대부분을 덮는다 */
      #faceleech {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 140ms ease-out;
      }
      #faceleech.visible {
        opacity: 1;
      }
      /* 실물 리그(3D)가 가운데를 맡는다 — 얼룩은 가장자리를 조이는 비네트로만 */
      #faceleech .blob {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(44, 17, 50, 0.55) 40%,
          rgba(44, 17, 50, 0.42) 68%,
          rgba(44, 17, 50, 0) 100%
        );
        animation: leechwobble 900ms ease-in-out infinite alternate;
      }
      #faceleech .b1 { left: -30%; top: -34%; width: 70%; height: 82%; }
      #faceleech .b2 { right: -32%; top: 30%; width: 66%; height: 78%; animation-delay: 300ms; }
      #faceleech .b3 { left: 4%; bottom: -40%; width: 78%; height: 68%; animation-delay: 600ms; }
      #faceleech .hint {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translateX(-50%);
        font: bold 22px monospace;
        color: #ff8a6a;
        text-shadow: 0 0 10px #000, 0 2px 2px #000;
        letter-spacing: 2px;
        white-space: nowrap;
      }
      @keyframes leechwobble {
        from { transform: scale(1) translate(0, 0); }
        to { transform: scale(1.07) translate(1.5%, 2.5%); }
      }
      /* 흡혈 피 튀김 — 빨릴 때마다 화면에 핏방울이 튀어 아래로 흘러내리다 사라진다 */
      #bloodfx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #bloodfx .blot {
        position: absolute;
        background: radial-gradient(
          closest-side,
          rgba(132, 12, 18, 0.92) 52%,
          rgba(92, 6, 10, 0.78) 74%,
          rgba(92, 6, 10, 0) 100%
        );
        animation: bloodsplat 1400ms ease-out forwards;
      }
      @keyframes bloodsplat {
        0% { transform: scale(0.2) translateY(0); opacity: 0; }
        8% { transform: scale(1.08) translateY(0); opacity: 1; }
        55% { transform: scale(1) translateY(16px); opacity: 0.95; }
        100% { transform: scale(1) translateY(52px); opacity: 0; }
      }
      /* 층 이동 암전 — 계단을 내려가는 동안 검게 잠긴다. 패링 탈색(#flash)과 달리
         일반 혼합이라 화면을 그냥 덮는다 */
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
      }
      /* 패링 탈색 — mix-blend-mode 오버레이 (docs/architecture.md §6) */
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        mix-blend-mode: saturation;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="flash"></div>
    <div id="fade"></div>
    <div id="hurt"></div>
    <div id="hitmarks"></div>
    <div id="faceleech">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="hint">거머리가 피를 빤다 — 근접 연타로 떼어내라! (누르고 있으면 못 빤다)</div>
    </div>
    <div id="bloodfx"></div>
    <div id="grapple">
      <div id="grapple-ring"><div id="grapple-inner"><span id="grapple-count"></span></div></div>
      <div id="grapple-label">물어뜯긴다! 근접 공격 연타!</div>
    </div>
    <div id="hud"></div>
    <div id="crosshair"><span class="chl t"></span><span class="chl b"></span><span class="chl l"></span><span class="chl r"></span></div>
    <div id="gain-center"><div id="gain-center-gold"><span class="gc-icon">◆</span><span class="gc-num"></span></div><div id="gain-center-xp"><span class="gc-icon">✦</span><span class="gc-num"></span></div></div>
    <div id="death">
      <div>사망</div>
      <div id="death-hint" style="font-size: 14px; white-space: pre-line; line-height: 1.7"></div>
    </div>
    <!-- 내용은 PauseMenu 가 만든다 -->
    <div id="pause"></div>
    <div id="altar-prompt"></div>
    <div id="interact-key"></div>
    <div id="sigil-toast"><div class="name"></div><div class="sub"></div></div>
    <div id="web-overlay"></div>
    <div id="status">
      <div id="buffs"><div id="buff-food"><div class="buff-cd"></div><span class="buff-sec"></span></div></div>
      <div id="status-bars">
        <div id="status-hp"><div id="status-hp-fill"></div></div>
        <div id="status-mana"><div id="status-mana-fill"></div></div>
      </div>
      <div id="status-stamina"><div id="status-stamina-fill"></div></div>
      <div id="status-lantern">
        <div id="status-lantern-track"><div id="status-lantern-fill"></div></div>
        <span id="status-lantern-text">100% 예비 2</span>
      </div>
      <div id="status-gold"><span id="status-gold-amt">◆ 0</span> &nbsp; <span id="status-xp-amt">XP 0</span></div>
      <div id="status-weapons">
        <span class="weapon-slot active" id="slot-ranged">LMB 권총</span>
        <span class="weapon-slot active" id="slot-melee">RMB 해머</span>
      </div>
    </div>
    <!-- 사선 십자 퀵슬롯 — 칸은 main.ts 가 만든다 (왼쪽 소모품 · 오른쪽 스킬) -->
    <div id="quick-diamond" class="dpad"><div class="label"></div></div>
    <div id="skill-diamond" class="dpad"><div class="label"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
