<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under World</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #9fe870;
        font: 13px/1.5 monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        pointer-events: none;
      }
      #death {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: rgba(60, 0, 0, 0.55);
        color: #ffd9d9;
        font: 20px/1.6 monospace;
        user-select: none;
      }
      #death.visible {
        display: flex;
      }
      #pause {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #d8e0ea;
        font: 22px/1.7 monospace;
        user-select: none;
        letter-spacing: 2px;
      }
      #pause.visible {
        display: flex;
      }
      #pause .hint {
        font-size: 14px;
        color: #98a2b0;
        letter-spacing: 0;
      }
      #altar-prompt {
        position: fixed;
        bottom: 12%;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(20, 18, 10, 0.82);
        border: 1px solid #6a5f3a;
        color: #e8c76a;
        font: 14px/1.7 monospace;
        padding: 10px 18px;
        white-space: pre;
        text-align: center;
        pointer-events: none;
      }
      #altar-prompt.visible {
        display: block;
      }
      /* 하단 중앙 상태 표시 — HP + 무기 슬롯 */
      #status {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 340px;
        pointer-events: none;
        user-select: none;
        font: 13px/1.5 monospace;
        text-align: center;
      }
      #status-hp {
        height: 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        margin-bottom: 6px;
      }
      #status-hp-fill {
        height: 100%;
        width: 100%;
        background: #3fae5a;
        transition: width 120ms linear;
      }
      #status-gold {
        color: #ffcc3a;
        margin-bottom: 4px;
        text-shadow: 0 0 6px rgba(255, 204, 58, 0.5);
      }
      #status-weapons {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .weapon-slot {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #3a3a44;
        color: #8a8f9a;
        padding: 3px 10px;
        white-space: pre;
      }
      .weapon-slot.active {
        border-color: #9fe870;
        color: #cfe8b0;
        background: rgba(30, 45, 20, 0.65);
      }
      /* 피격 — 붉은 비네트 */
      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 0, 0, 0) 52%,
          rgba(190, 10, 10, 0.65) 100%
        );
      }
      /* 패링 탈색 — mix-blend-mode 오버레이 (docs/architecture.md §6) */
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        mix-blend-mode: saturation;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="flash"></div>
    <div id="hurt"></div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="death">
      <div>사망</div>
      <div id="death-hint" style="font-size: 14px">Enter 키로 재시작</div>
    </div>
    <div id="pause">
      <div>일시정지</div>
      <div class="hint">클릭하면 계속 · ESC로 다시 멈춤</div>
    </div>
    <div id="altar-prompt"></div>
    <div id="status">
      <div id="status-hp"><div id="status-hp-fill"></div></div>
      <div id="status-gold">◆ 0</div>
      <div id="status-weapons">
        <span class="weapon-slot active" id="slot-ranged">LMB 권총</span>
        <span class="weapon-slot active" id="slot-melee">RMB 해머</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
