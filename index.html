<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DESCENT PROTOCOL</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #9fe870;
        font: 13px/1.5 monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        pointer-events: none;
      }
      #death {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: rgba(60, 0, 0, 0.55);
        color: #ffd9d9;
        font: 20px/1.6 monospace;
        user-select: none;
      }
      #death.visible {
        display: flex;
      }
      /* 패링 탈색 — mix-blend-mode 오버레이 (docs/architecture.md §6) */
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        mix-blend-mode: saturation;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="flash"></div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="death">
      <div>사망</div>
      <div style="font-size: 14px">Enter 키로 재시작</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
