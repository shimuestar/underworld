<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under World</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #9fe870;
        font: 13px/1.5 monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        pointer-events: none;
      }
      #death {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: rgba(60, 0, 0, 0.55);
        color: #ffd9d9;
        font: 20px/1.6 monospace;
        user-select: none;
      }
      #death.visible {
        display: flex;
      }
      #pause {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        color: #d8e0ea;
        font: 22px/1.7 monospace;
        user-select: none;
        letter-spacing: 2px;
      }
      #pause.visible {
        display: flex;
      }
      /* 클릭을 삼키면 포인터 락을 다시 걸 수 없어 재개가 막힌다 —
         메뉴 패널만 예외로 클릭을 받는다 (Input 이 #pause 안 클릭은 락에서 제외) */
      #pause,
      #death {
        pointer-events: none;
      }
      #pause .menu {
        pointer-events: auto;
      }
      #altar-prompt {
        position: fixed;
        /* 하단 상태 블록(바+랜턴+골드+무기 슬롯 ≒ 110px) 위로 올린다 —
           12% 로 두면 창이 낮을 때 HP 바와 겹친다 */
        bottom: 132px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(20, 18, 10, 0.82);
        border: 1px solid #6a5f3a;
        color: #e8c76a;
        font: 14px/1.7 monospace;
        padding: 10px 18px;
        white-space: pre;
        text-align: center;
        pointer-events: none;
      }
      #altar-prompt.visible {
        display: block;
      }
      /* 각인 획득 — 화면 가운데 위쪽에 잠깐 뜬다. 각인 색을 그대로 입혀
         "바닥에서 본 그 색"과 이어지게 한다 */
      #sigil-toast {
        position: fixed;
        top: 26%;
        left: 50%;
        transform: translate(-50%, -8px);
        display: none;
        text-align: center;
        font: 15px/1.6 monospace;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 180ms linear, transform 180ms ease-out;
      }
      #sigil-toast.visible {
        display: block;
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #sigil-toast .name {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      #sigil-toast .sub {
        color: #cfd6df;
        margin-top: 2px;
      }
      /* 하단 중앙 상태 표시 — HP + 무기 슬롯 */
      #status {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 340px;
        pointer-events: none;
        user-select: none;
        font: 13px/1.5 monospace;
        text-align: center;
      }
      /* 중앙 기준 좌=HP 우=마나. 각 막대는 중앙에서 바깥으로 자란다 */
      #status-bars {
        display: flex;
        gap: 4px;
        margin-bottom: 3px;
      }
      #status-hp,
      #status-mana {
        flex: 1;
        height: 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        display: flex;
      }
      #status-hp {
        justify-content: flex-end; /* 중앙 쪽에 붙어 왼쪽으로 줄어든다 */
      }
      #status-hp-fill,
      #status-mana-fill {
        height: 100%;
        width: 100%;
        background: #3fae5a;
        transition: width 120ms linear;
      }
      #status-mana-fill {
        background: #4a9eff;
      }
      /* 무적(테스트 키 G) — HP·마나 바가 함께 깜빡인다. 켜 둔 채로 잊고
         플레이하는 사고를 막으려면 화면에서 계속 티가 나야 한다 */
      @keyframes god-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
      #status-hp.god,
      #status-mana.god {
        animation: god-blink 0.62s ease-in-out infinite;
        border-color: #e8d24a;
      }
      /* 스킬 테스트(U) — 마나 무한. 켜 둔 채 잊지 않게 마나 바 틀이 하늘색으로 깜빡인다 */
      #status-mana.skilltest {
        animation: god-blink 0.9s ease-in-out infinite;
        border-color: #4fc3ff;
      }
      /* 거미줄에 걸림 — 화면 가장자리에 끈끈한 흰 막. 끊을수록 옅어진다 */
      #web-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms linear;
        background:
          radial-gradient(ellipse at center, rgba(255, 255, 255, 0) 38%, rgba(226, 232, 220, 0.5) 100%),
          repeating-conic-gradient(
            from 0deg at 50% 50%,
            rgba(230, 233, 224, 0.16) 0deg 2deg,
            rgba(0, 0, 0, 0) 2deg 22deg
          );
      }
      /* 스태미너 — HP·마나 바 바로 아래, 같은 너비의 얇은 띠 */
      #status-stamina {
        height: 4px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        border-top: none;
        margin-bottom: 4px;
      }
      #status-stamina-fill {
        height: 100%;
        width: 100%;
        background: #c9d17a;
        transition: width 90ms linear;
      }
      /* 탈진 — 회복선까지 찰 때까지 질주 불가.
         채움이 0이라 막대가 안 보이므로 틀 자체를 붉게 물들인다 */
      #status-stamina.spent {
        border-color: #7a3a3a;
        background: rgba(96, 34, 34, 0.55);
      }
      #status-stamina.spent #status-stamina-fill {
        background: #a05050;
      }
      /* 랜턴 — 아주 얇은 실선 게이지 + 오른쪽에 % / 예비 개수 */
      #status-lantern {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 5px;
      }
      #status-lantern-track {
        flex: 1;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
      }
      #status-lantern-fill {
        height: 100%;
        width: 100%;
        background: #e0a33a;
        transition: width 120ms linear;
      }
      #status-lantern-text {
        font: 11px/1 monospace;
        color: #8a8f9a;
        letter-spacing: 1px;
        min-width: 92px; /* 자릿수가 바뀌어도 게이지 길이가 흔들리지 않게 */
        text-align: right;
        white-space: nowrap;
      }
      #status-lantern.low #status-lantern-fill {
        background: #e05a3a;
      }
      #status-lantern.low #status-lantern-text {
        color: #e0a33a;
      }
      #status-lantern.off #status-lantern-fill {
        background: #4a4a52;
      }
      #status-gold {
        color: #ffcc3a;
        margin-bottom: 4px;
        text-shadow: 0 0 6px rgba(255, 204, 58, 0.5);
      }
      #status-weapons {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      /* 퀵슬롯 바 — 무기 슬롯 위. 등록만 되고 개수가 0이면 흐리게 남겨 둔다
         (자리가 사라지면 "몇 번이 물약이었지"를 매번 다시 외워야 한다) */
      /* 다이아 퀵슬롯 — 마름모 넷을 사선 십자로 놓는다. 왼쪽=소모품, 오른쪽=스킬.
         화면 아래 양 끝이라 조준선에서 눈을 떼지 않아도 가장자리 시야에 걸린다 */
      .dpad {
        position: fixed;
        bottom: 22px;
        width: 160px;
        height: 160px;
        pointer-events: none;
        user-select: none;
        font: 10px/1 monospace;
      }
      /* 화면 끝이 아니라 가운데 상태창(340px) 바로 옆에 붙인다 — 소모품·체력마나·스킬이
         한 줄로 이어져 눈이 한 번에 훑는다. 해상도가 바뀌어도 간격이 유지되게 중앙 기준 */
      #quick-diamond {
        right: 50%;
        margin-right: 186px;
      }
      #skill-diamond {
        left: 50%;
        margin-left: 186px;
      }
      .dslot {
        position: absolute;
        width: 58px;
        height: 58px;
        margin: -29px 0 0 -29px;
      }
      /* 자리 — 위 · 오른쪽 · 아래 · 왼쪽 (시계 방향으로 1·2·3·4번 칸) */
      .dslot.p0 { top: 37px; left: 80px; }
      .dslot.p1 { top: 80px; left: 123px; }
      .dslot.p2 { top: 123px; left: 80px; }
      .dslot.p3 { top: 80px; left: 37px; }
      /* 테두리만 돌린다 — 안의 글자·아이콘은 세워 둔 채로 마름모가 된다 */
      .dslot .frame {
        position: absolute;
        inset: 0;
        transform: rotate(45deg);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #3a3a44;
        overflow: hidden;
      }
      /* 차오름 — 스킬은 쿨다운, 소모품은 마시는 중. 마름모라 비스듬히 찬다 */
      .dslot .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--fill, 0%);
        background: rgba(232, 199, 106, 0.28);
      }
      .dslot .key {
        position: absolute;
        top: 9px;
        left: 0;
        right: 0;
        text-align: center;
        color: #8a8f9a;
      }
      .dslot .body {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        line-height: 0;
      }
      .dslot .num {
        position: absolute;
        bottom: 8px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #cfd2da;
      }
      /* 스킬 색 원반 — 24종이 전부 다른 색이라 이것만으로 구분된다 */
      .dslot .mark {
        display: inline-block;
        width: 15px;
        height: 15px;
        border-radius: 50%;
      }
      .dslot.empty .frame {
        opacity: 0.3;
      }
      .dslot.empty .key {
        opacity: 0.4;
      }
      .dslot.ready .frame {
        border-color: #4a6a8a;
      }
      /* 다 썼거나 지금 써도 소용없는 칸 — 눈에 덜 걸리게 */
      .dslot.spent {
        opacity: 0.4;
      }
      .dslot.spent .frame {
        border-color: #3a3a44;
      }
      .dslot.item.ready .frame {
        border-color: #6a5f3a;
      }
      .dslot.cool .mark,
      .dslot.nomana .mark {
        filter: grayscale(0.8) brightness(0.55);
      }
      /* 선택된 칸 — 가운데 클릭(패드 Y)이 쓰는 칸. 금빛 테두리 */
      .dslot.selected .frame {
        border-color: #e8c76a;
        box-shadow: 0 0 7px rgba(232, 199, 106, 0.45);
      }
      .dslot.selected .key {
        color: #e8c76a;
      }
      .dslot.drinking .frame {
        border-color: #e8c76a;
      }
      /* 고른 스킬 이름 — 마름모 안에는 안 들어가므로 뭉치 위에 한 줄로 */
      .dpad .label {
        position: absolute;
        bottom: 100%;
        left: -20px;
        right: -20px;
        text-align: center;
        font-size: 11px;
        color: #cfd2da;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .weapon-slot {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #3a3a44;
        color: #8a8f9a;
        padding: 3px 10px;
        white-space: pre;
      }
      .weapon-slot.charged {
        border-color: #ffb347;
        color: #ffd9a0;
        background: rgba(70, 40, 10, 0.7);
      }
      .weapon-slot.active {
        border-color: #9fe870;
        color: #cfe8b0;
        background: rgba(30, 45, 20, 0.65);
      }
      /* 피격 — 붉은 비네트 */
      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 0, 0, 0) 52%,
          rgba(190, 10, 10, 0.65) 100%
        );
      }
      /* 방향 피격 지시 — 화면 중앙 링의 호 하나가 피해가 온 쪽을 가리킨다.
         시선 기준 회전이라 뒤에서 맞으면 아래쪽 호가 뜬다 (회전각은 main 이 계산) */
      #dmgdir {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 34vmin;
        height: 34vmin;
        margin: -17vmin 0 0 -17vmin;
        border: 1vmin solid transparent;
        border-top-color: rgba(255, 46, 46, 0.9);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      /* 구울 몸부림 게이지 — 물린 동안 조준점 아래. 연타가 원형 링을 시계 방향으로 채운다 */
      #grapple {
        position: fixed;
        left: 50%;
        top: 54%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        pointer-events: none;
      }
      #grapple.visible {
        opacity: 1;
      }
      #grapple-ring {
        width: 94px;
        height: 94px;
        border-radius: 50%;
        background: conic-gradient(#ff5a4a calc(var(--frac, 0) * 1turn), rgba(70, 12, 12, 0.55) 0turn);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(160, 0, 0, 0.75);
      }
      #grapple-inner {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(12, 8, 8, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 20px monospace;
        color: #ff6a5a;
        text-shadow: 0 0 6px rgba(120, 0, 0, 0.9);
      }
      #grapple-label {
        font: bold 20px monospace;
        color: #ff5a4a;
        text-shadow: 0 0 8px rgba(120, 0, 0, 0.9), 0 2px 2px #000;
        letter-spacing: 2px;
      }
      /* 거머리 얼굴 가림 — 흡혈당하는 동안 자줏빛 살덩이가 화면 대부분을 덮는다 */
      #faceleech {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 140ms ease-out;
      }
      #faceleech.visible {
        opacity: 1;
      }
      /* 실물 리그(3D)가 가운데를 맡는다 — 얼룩은 가장자리를 조이는 비네트로만 */
      #faceleech .blob {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(44, 17, 50, 0.55) 40%,
          rgba(44, 17, 50, 0.42) 68%,
          rgba(44, 17, 50, 0) 100%
        );
        animation: leechwobble 900ms ease-in-out infinite alternate;
      }
      #faceleech .b1 { left: -30%; top: -34%; width: 70%; height: 82%; }
      #faceleech .b2 { right: -32%; top: 30%; width: 66%; height: 78%; animation-delay: 300ms; }
      #faceleech .b3 { left: 4%; bottom: -40%; width: 78%; height: 68%; animation-delay: 600ms; }
      #faceleech .hint {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translateX(-50%);
        font: bold 22px monospace;
        color: #ff8a6a;
        text-shadow: 0 0 10px #000, 0 2px 2px #000;
        letter-spacing: 2px;
        white-space: nowrap;
      }
      @keyframes leechwobble {
        from { transform: scale(1) translate(0, 0); }
        to { transform: scale(1.07) translate(1.5%, 2.5%); }
      }
      /* 흡혈 피 튀김 — 빨릴 때마다 화면에 핏방울이 튀어 아래로 흘러내리다 사라진다 */
      #bloodfx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #bloodfx .blot {
        position: absolute;
        background: radial-gradient(
          closest-side,
          rgba(132, 12, 18, 0.92) 52%,
          rgba(92, 6, 10, 0.78) 74%,
          rgba(92, 6, 10, 0) 100%
        );
        animation: bloodsplat 1400ms ease-out forwards;
      }
      @keyframes bloodsplat {
        0% { transform: scale(0.2) translateY(0); opacity: 0; }
        8% { transform: scale(1.08) translateY(0); opacity: 1; }
        55% { transform: scale(1) translateY(16px); opacity: 0.95; }
        100% { transform: scale(1) translateY(52px); opacity: 0; }
      }
      /* 층 이동 암전 — 계단을 내려가는 동안 검게 잠긴다. 패링 탈색(#flash)과 달리
         일반 혼합이라 화면을 그냥 덮는다 */
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
      }
      /* 패링 탈색 — mix-blend-mode 오버레이 (docs/architecture.md §6) */
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        mix-blend-mode: saturation;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="flash"></div>
    <div id="fade"></div>
    <div id="hurt"></div>
    <div id="dmgdir"></div>
    <div id="faceleech">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="hint">거머리가 피를 빤다 — 근접 연타로 떼어내라! (누르고 있으면 못 빤다)</div>
    </div>
    <div id="bloodfx"></div>
    <div id="grapple">
      <div id="grapple-ring"><div id="grapple-inner"><span id="grapple-count"></span></div></div>
      <div id="grapple-label">물어뜯긴다! 근접 공격 연타!</div>
    </div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="death">
      <div>사망</div>
      <div id="death-hint" style="font-size: 14px">Enter 키로 재시작</div>
    </div>
    <!-- 내용은 PauseMenu 가 만든다 -->
    <div id="pause"></div>
    <div id="altar-prompt"></div>
    <div id="sigil-toast"><div class="name"></div><div class="sub"></div></div>
    <div id="web-overlay"></div>
    <div id="status">
      <div id="status-bars">
        <div id="status-hp"><div id="status-hp-fill"></div></div>
        <div id="status-mana"><div id="status-mana-fill"></div></div>
      </div>
      <div id="status-stamina"><div id="status-stamina-fill"></div></div>
      <div id="status-lantern">
        <div id="status-lantern-track"><div id="status-lantern-fill"></div></div>
        <span id="status-lantern-text">100% 예비 2</span>
      </div>
      <div id="status-gold">◆ 0</div>
      <div id="status-weapons">
